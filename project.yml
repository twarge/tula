name: Tula
options:
  bundleIdPrefix: com.twarge
  deploymentTarget:
    iOS: "17.4"
    macOS: "14.4"
  createIntermediateGroups: true

packages:
  ERPNextKit:
    path: ERPNextKit

targets:
  Tula:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Tula
    dependencies:
      - package: ERPNextKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.Tula
        PRODUCT_NAME: Tula
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Tula/Info.plist
      properties:
        CFBundleDisplayName: Tula
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # HTTPS only, except plain-HTTP ERPNext dev servers on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Tula/Tula.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  Tula:
    build:
      targets:
        Tula: all
    run:
      config: Debug
    test:
      config: Debug
