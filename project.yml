name: Tula
options:
  bundleIdPrefix: com.twarge
  deploymentTarget:
    iOS: "17.4"
    macOS: "14.4"
  createIntermediateGroups: true

packages:
  ERPNextKit:
    path: ERPNextKit

targets:
  Tula:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Tula
    dependencies:
      - package: ERPNextKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twarge.Tula
        PRODUCT_NAME: Tula
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Real (non-ad-hoc) signing so the keychain's "Always Allow" binds to
        # the stable identifier+team, not one build's hash — otherwise every
        # rebuild re-prompts for the keychain password.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 257KW9ZJFP
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Tula/Info.plist
      properties:
        CFBundleDisplayName: Tula
        # Left out, XcodeGen writes a literal 1.0 and 1, which the App Store
        # workflow's MARKETING_VERSION and CURRENT_PROJECT_VERSION overrides
        # can't reach: every upload was 1.0 (1), and App Store Connect refused
        # each one after the first.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # iPhone (the Duo included): portrait and both landscapes. iPad and
        # macOS don't read the ~iphone key.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: all four. App Store Connect rejects an iPad build that
        # supports multitasking without them ("Invalid bundle. No orientations
        # were specified"); Tula does (multiple scenes, no UIRequiresFullScreen).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Scene-based lifecycle, declared as Xcode's
        # UIApplicationSceneManifest_Generation would (the plist is written
        # from these properties, so INFOPLIST_KEY_* settings don't apply).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # HTTPS only, except plain-HTTP ERPNext dev servers on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Tula/Tula.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

schemes:
  Tula:
    build:
      targets:
        Tula: all
    run:
      config: Debug
    test:
      config: Debug
